name: Release

# Cut a release by pushing a version tag (e.g. `git tag v0.1.0 && git push --tags`).
# `workflow_dispatch` lets you run the three platform builds by hand (from the
# Actions tab) to test them without publishing — the release job is skipped
# unless the run was triggered by a tag.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

# JUCE and FxmeTools are fetched by CMake at the commits pinned in
# cmake/Dependencies.cmake; -DFXME_USE_SIBLINGS=OFF makes sure of it.

jobs:
  # ── Linux x86_64 ──────────────────────────────────────────────────────────
  build-linux-x86_64:
    runs-on: ubuntu-latest
    steps:
      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            libasound2-dev libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libfreetype-dev libfontconfig1-dev libgl1-mesa-dev \
            libcurl4-openssl-dev libwebkit2gtk-4.1-dev \
            libxi-dev libegl-dev    # JUCE 9: XInput2 (multi-touch), EGL (OpenGL)

      - uses: actions/checkout@v4
        with:
          path: StairwellToHeaven

      - name: Configure & Build
        run: |
          cmake -B StairwellToHeaven/build -S StairwellToHeaven -DCMAKE_BUILD_TYPE=Release -DFXME_USE_SIBLINGS=OFF -DSTH_BUILD_TESTS=ON
          # The embedded image/preset binary-data target links a big blob —
          # build it alone first to keep peak RAM down, then the rest.
          cmake --build StairwellToHeaven/build --config Release --target StairwellToHeavenBinaryData --parallel 1
          cmake --build StairwellToHeaven/build --config Release --parallel 2

      - name: Engine tests
        run: ctest --test-dir StairwellToHeaven/build --output-on-failure

      - name: Package
        run: |
          ART=StairwellToHeaven/build/StairwellToHeaven_artefacts/Release
          mkdir -p staging
          cp -r "$ART/VST3/StairwellToHeaven.vst3" staging/
          cp "$ART/CLAP/StairwellToHeaven.clap" staging/
          cp -r "$ART/Standalone/StairwellToHeaven" staging/
          zip -r ${{ github.workspace }}/StairwellToHeaven-Linux-x86_64.zip staging/

      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: StairwellToHeaven-Linux-x86_64.zip

  # ── Windows x86_64 ────────────────────────────────────────────────────────
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: StairwellToHeaven

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure & Build
        run: |
          cmake -B StairwellToHeaven/build -S StairwellToHeaven -G Ninja -DCMAKE_BUILD_TYPE=Release -DFXME_USE_SIBLINGS=OFF
          cmake --build StairwellToHeaven/build --target StairwellToHeavenBinaryData --parallel 1
          cmake --build StairwellToHeaven/build --parallel

      - name: Package
        shell: bash
        run: |
          ART=StairwellToHeaven/build/StairwellToHeaven_artefacts/Release
          mkdir -p staging
          cp -r "$ART/VST3/StairwellToHeaven.vst3" staging/
          cp "$ART/CLAP/StairwellToHeaven.clap" staging/
          cp -r "$ART/Standalone/StairwellToHeaven.exe" staging/
          7z a StairwellToHeaven-Windows-x86_64.zip ./staging/*

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          path: StairwellToHeaven-Windows-x86_64.zip

  # ── macOS universal (arm64 + x86_64) ──────────────────────────────────────
  build-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          path: StairwellToHeaven

      - name: Configure & Build
        run: |
          # Passed explicitly as well as set in CMakeLists: a -D on the command
          # line is in the cache before any CMakeLists line runs, so it cannot
          # be missed the way an in-file set() after project() can.
          cmake -B StairwellToHeaven/build -S StairwellToHeaven \
            -DCMAKE_BUILD_TYPE=Release \
            -DFXME_USE_SIBLINGS=OFF \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=10.13
          cmake --build StairwellToHeaven/build --config Release --target StairwellToHeavenBinaryData --parallel 1
          # Capped at 2: the universal build doubles the compile/link load.
          cmake --build StairwellToHeaven/build --config Release --parallel 2

      # This step used to print `lipo -info` and pass whatever it found, so a
      # single-architecture build sailed through CI and shipped. It now fails
      # the run, and it checks every bundle rather than only the VST3.
      - name: Verify universal binaries
        run: |
          set -euo pipefail
          ART=StairwellToHeaven/build/StairwellToHeaven_artefacts/Release
          status=0
          for bundle in \
            "$ART/VST3/StairwellToHeaven.vst3/Contents/MacOS/StairwellToHeaven" \
            "$ART/AU/StairwellToHeaven.component/Contents/MacOS/StairwellToHeaven" \
            "$ART/CLAP/StairwellToHeaven.clap/Contents/MacOS/StairwellToHeaven" \
            "$ART/Standalone/StairwellToHeaven.app/Contents/MacOS/StairwellToHeaven"
          do
            if [[ ! -f "$bundle" ]]; then
              echo "::error::missing binary: $bundle"; status=1; continue
            fi
            info=$(lipo -info "$bundle")
            echo "$info"
            for arch in x86_64 arm64; do
              if ! grep -qw "$arch" <<< "$info"; then
                echo "::error::$bundle has no $arch slice"; status=1
              fi
            done
            # Intel users on Catalina need this to be <= 10.15.
            vtool -show-build "$bundle" | grep -E 'minos|platform' || true
          done
          exit $status

      # Ad-hoc signature. Unsigned bundles built on another machine are a
      # classic "the plugin never appears in the scan": recent macOS refuses to
      # load them, and AU validation rejects them outright. This is not
      # notarisation — users still have to clear the download quarantine — but
      # it removes the failure that costs nothing to remove.
      - name: Ad-hoc codesign
        run: |
          set -euo pipefail
          ART=StairwellToHeaven/build/StairwellToHeaven_artefacts/Release
          for bundle in "$ART/VST3/StairwellToHeaven.vst3" "$ART/AU/StairwellToHeaven.component" "$ART/CLAP/StairwellToHeaven.clap" "$ART/Standalone/StairwellToHeaven.app"; do
            codesign --force --deep --sign - --timestamp=none "$bundle"
            codesign --verify --verbose "$bundle"
          done

      - name: Build pkg installer
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [[ "$VERSION" =~ ^[0-9] ]] || VERSION="0.1.0"   # manual runs have no tag
          ART=StairwellToHeaven/build/StairwellToHeaven_artefacts/Release
          mkdir -p pkg_root/Library/Audio/Plug-Ins/VST3
          mkdir -p pkg_root/Library/Audio/Plug-Ins/Components
          mkdir -p pkg_root/Library/Audio/Plug-Ins/CLAP
          cp -r "$ART/VST3/StairwellToHeaven.vst3" pkg_root/Library/Audio/Plug-Ins/VST3/
          cp -r "$ART/AU/StairwellToHeaven.component" pkg_root/Library/Audio/Plug-Ins/Components/
          cp -r "$ART/CLAP/StairwellToHeaven.clap" pkg_root/Library/Audio/Plug-Ins/CLAP/
          pkgbuild \
            --root pkg_root \
            --identifier com.fx-mechanics.StairwellToHeaven \
            --version "$VERSION" \
            --install-location / \
            StairwellToHeaven-macOS.pkg

      - uses: actions/upload-artifact@v4
        with:
          name: macos-pkg
          path: StairwellToHeaven-macOS.pkg

      - name: Package VST3, AU, CLAP and Standalone zips
        run: |
          ART=StairwellToHeaven/build/StairwellToHeaven_artefacts/Release
          mkdir -p staging
          cp -r "$ART/VST3/StairwellToHeaven.vst3" staging/
          cp -r "$ART/AU/StairwellToHeaven.component" staging/
          cp -r "$ART/CLAP/StairwellToHeaven.clap" staging/
          cp -r "$ART/Standalone/StairwellToHeaven.app" staging/
          zip -r ${{ github.workspace }}/StairwellToHeaven-macOS-universal.zip staging/

      - uses: actions/upload-artifact@v4
        with:
          name: macos-zip
          path: StairwellToHeaven-macOS-universal.zip

  # ── Publish GitHub Release (tag pushes only) ──────────────────────────────
  release:
    needs: [build-linux-x86_64, build-windows, build-macos]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artefacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.zip
            artifacts/*.pkg
          generate_release_notes: true
